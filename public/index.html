<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beyblade 比賽報名</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a class="brand" href="/"><span class="spin"></span> BEYX REG</a>
      <div>
        <a class="btn ghost" href="/status.html">我的報名</a>
        <a class="btn ghost" href="/admin.html">主辦後台</a>
      </div>
    </div>
    <h1>陀螺報名</h1>
    <p class="lede">可以報正式比賽或者 Fun Play。提交後待主辦確認，確認後先喺「我的報名」顯示付款方式。</p>
    <div class="toolbar" id="kindTabs">
      <button class="btn" type="button" data-kind="">全部</button>
      <button class="btn ghost" type="button" data-kind="tournament">比賽</button>
      <button class="btn ghost" type="button" data-kind="funplay">Fun Play</button>
    </div>
    <div id="list" class="grid"></div>
    <footer>可重用比賽系統 · 同一套後台開下一場即可</footer>
  </div>
  <script type="module">
    import { api, fmtDate, feeText, kindPill } from "/app.js";
    const box = document.getElementById("list");
    let allEvents = [];
    let kind = "";

    function render() {
      const events = kind ? allEvents.filter((e) => e.event_kind === kind) : allEvents;
      document.querySelectorAll("#kindTabs [data-kind]").forEach((btn) => {
        btn.className = btn.dataset.kind === kind ? "btn" : "btn ghost";
      });
      if (!events.length) {
        box.innerHTML = `<div class="card">暫時未有呢類場次。主辦可到 <a href="/admin.html">後台</a> 開新場。</div>`;
        return;
      }
      box.innerHTML = events.map(ev => {
        const taken = ev.counts?.taken || 0;
        const open = ev.registration_open;
        return `<article class="card">
          ${ev.poster_url ? `<img class="poster" src="${ev.poster_url}" alt="${ev.title}" />` : ""}
          <div class="meta">${kindPill(ev)}<span class="pill">${open ? "接受報名" : "已截止"}</span><span>${feeText(ev)}</span></div>
          <h3>${ev.title}</h3>
          <p class="lede">${ev.subtitle || ""}</p>
          <p class="meta">${fmtDate(ev.event_date, ev.start_time, ev.end_time)} · ${ev.venue || "地點待公布"}</p>
          <p class="meta">已確認 ${taken} / ${ev.capacity} · 待確認 ${ev.counts?.pending || 0}</p>
          <p><a class="btn" href="/event.html?slug=${encodeURIComponent(ev.slug)}">查看／報名</a></p>
        </article>`;
      }).join("");
    }

    try {
      const data = await api("/api/events");
      allEvents = data.events || [];
      document.getElementById("kindTabs").onclick = (e) => {
        const btn = e.target.closest("[data-kind]");
        if (!btn) return;
        kind = btn.dataset.kind;
        render();
      };
      render();
    } catch (e) {
      box.innerHTML = `<div class="card">未能載入場次：${e.message}</div>`;
    }
  </script>
</body>
</html>
