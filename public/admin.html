<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>主辦後台</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .tabs { display:flex; gap:0.5rem; margin:1rem 0; border-bottom:1px solid #334155; }
    .tab { padding:0.6rem 1.2rem; background:transparent; border:none; color:#94a3b8; cursor:pointer; font-size:0.95rem; border-bottom:2px solid transparent; }
    .tab.active { color:#f97316; border-bottom-color:#f97316; font-weight:600; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a class="brand" href="/"><span class="spin"></span> BEYX REG</a>
      <div>
        <a class="btn ghost" href="/">公開站</a>
        <button class="btn ghost" id="logout" type="button">登出</button>
      </div>
    </div>
    <h1>主辦後台</h1>
    <p class="lede">確認報名之後，玩家先可以喺「我的報名」見到 PayMe / FPS。確認後可複製 WhatsApp 訊息。</p>

    <form id="login" class="card">
      <label>Admin 密碼<input type="password" name="password" required /></label>
      <button class="btn" type="submit">登入</button>
      <p id="loginMsg" class="lede"></p>
    </form>

    <div id="app" class="hidden">
      <div class="toolbar" style="flex-wrap:wrap; gap:0.6rem; align-items:center;">
        <button class="btn" id="newEvent" type="button">開新比賽</button>
        <button class="btn ghost" id="editEvent" type="button">編輯</button>
        <select id="eventFilter" style="min-width:220px;"></select>
        <select id="statusFilter" style="min-width:140px;">
          <option value="">全部狀態</option>
          <option value="pending">待確認</option>
          <option value="confirmed">已確認待付款</option>
          <option value="paid">已付款</option>
          <option value="waitlist">候補</option>
          <option value="rejected">未獲接納</option>
        </select>
        <button class="btn ghost" id="reload" type="button">重新整理</button>
      </div>
      <div id="eventEditor" class="card hidden"></div>

      <div class="tabs">
        <button class="tab active" data-tab="regs">報名名單</button>
        <button class="tab" data-tab="draw">正選抽選</button>
        <button class="tab" data-tab="bracket">淘汰賽</button>
      </div>

      <div id="tab-regs" class="tab-content active">
        <div class="card" style="overflow:auto">
          <h3 id="regTitle">報名名單</h3>
          <div id="regs"></div>
        </div>
      </div>

      <div id="tab-draw" class="tab-content">
        <div class="card">
          <h3>正選抽選</h3>
          <div id="drawControls"></div>
          <div id="drawAnim" style="margin:1rem 0; min-height:64px; font-size:1.5rem; text-align:center; font-weight:700;"></div>
          <div id="drawResult"></div>
          <div id="drawHistory" style="margin-top:1rem"></div>
        </div>
      </div>

      <div id="tab-bracket" class="tab-content">
        <div class="card">
          <h3>淘汰賽</h3>
          <button class="btn" id="genBracket" type="button">用最近抽選生成淘汰賽</button>
          <div id="bracketArea" style="margin-top:1rem"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { api, statusPill, feeText } from "/app.js";

    const loginForm = document.getElementById("login");
    const app = document.getElementById("app");
    const eventFilter = document.getElementById("eventFilter");
    const statusFilter = document.getElementById("statusFilter");
    const editor = document.getElementById("eventEditor");
    let events = [];

    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
      };
    });

    function authed() { return !!localStorage.getItem("beyx_admin"); }

    function showApp(on) {
      loginForm.classList.toggle("hidden", on);
      app.classList.toggle("hidden", !on);
    }

    document.getElementById("logout").onclick = () => {
      localStorage.removeItem("beyx_admin");
      showApp(false);
    };

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = new FormData(loginForm).get("password");
      const msg = document.getElementById("loginMsg");
      msg.textContent = "";
      try {
        const data = await api("/api/admin/login", { method: "POST", body: { password } });
        localStorage.setItem("beyx_admin", data.token);
        showApp(true);
        await boot();
      } catch (err) {
        msg.textContent = err.message;
      }
    });

    function field(name, label, value = "", type = "text") {
      return `<label>${label}<input name="${name}" type="${type}" value="${String(value ?? "").replace(/"/g, "&quot;")}" /></label>`;
    }

    function renderEditor(ev = {}) {
      editor.classList.remove("hidden");
      const cats = Array.isArray(ev.categories) ? ev.categories.join(",") : (ev.categories || "U12,公開組");
      editor.innerHTML = `
        <h3>${ev.id ? "編輯場次" : "開新場次"}</h3>
        <form id="evForm">
          <label>類型
            <select name="event_kind">
              <option value="tournament" ${ev.event_kind !== "funplay" ? "selected" : ""}>比賽</option>
              <option value="funplay" ${ev.event_kind === "funplay" ? "selected" : ""}>Fun Play</option>
            </select>
          </label>
          <div class="row2">
            ${field("title", "名稱", ev.title || "")}
            ${field("slug", "Slug（網址）", ev.slug || "")}
          </div>
          ${field("subtitle", "副題", ev.subtitle || "")}
          <div class="row2">
            ${field("venue", "場地", ev.venue || "")}
            ${field("address", "地址", ev.address || "")}
          </div>
          <div class="row2">
            ${field("event_date", "日期", ev.event_date || "", "date")}
            ${field("registration_deadline", "報名截止（可含時間）", ev.registration_deadline || "")}
          </div>
          <div class="row2">
            ${field("start_time", "開始", ev.start_time || "", "time")}
            ${field("end_time", "結束", ev.end_time || "", "time")}
          </div>
          <div class="row2">
            ${field("capacity", "名額", ev.capacity ?? 32, "number")}
            ${field("entry_fee", "報名費", ev.entry_fee ?? 50, "number")}
          </div>
          ${field("categories", "組別（逗號分隔）", cats)}
          <label>簡介<textarea name="description">${ev.description || ""}</textarea></label>
          <label>規則<textarea name="rules">${ev.rules || ""}</textarea></label>
          <div class="row2">
            ${field("payme_id", "PayMe 號碼／ID", ev.payme_id || "")}
            ${field("payme_link", "PayMe 連結", ev.payme_link || "")}
          </div>
          <div class="row2">
            ${field("fps_id", "FPS 電話／識別碼", ev.fps_id || "")}
            ${field("fps_name", "FPS 戶名", ev.fps_name || "")}
          </div>
          ${field("whatsapp", "主辦 WhatsApp", ev.whatsapp || "")}
          <label>付款備註<textarea name="payment_note">${ev.payment_note || "確認後請轉帳，備註填 Belader 名稱。"}</textarea></label>
          ${ev.poster_url ? `<p><img class="poster" src="${ev.poster_url}" alt="海報" /></p>
          <button class="btn bad" type="button" id="delPoster">移除海報</button>` : ""}
          <label>上傳海報（JPG/PNG/WEBP；未開 R2 請小於 450KB）<input type="file" id="posterFile" accept="image/jpeg,image/png,image/webp,image/gif" /></label>
          <label>或貼海報圖片網址<input name="poster_url" value="${String(ev.poster_url || "").startsWith("http") || String(ev.poster_url || "").startsWith("/") ? String(ev.poster_url).replace(/"/g, "&quot;") : ""}" placeholder="https://..." /></label>
          <label><input type="checkbox" name="registration_open" ${ev.registration_open !== false ? "checked" : ""} /> 開放報名</label>
          <label><input type="checkbox" name="show_public_list" ${ev.show_public_list ? "checked" : ""} /> 公開已報名名單</label>
          <div class="toolbar">
            <button class="btn" type="submit">儲存</button>
            <button class="btn ghost" type="button" id="cancelEv">取消</button>
            ${ev.id ? `<button class="btn bad" type="button" id="delEv">刪除比賽</button>` : ""}
          </div>
        </form>`;

      document.getElementById("cancelEv").onclick = () => editor.classList.add("hidden");
      document.getElementById("evForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        body.registration_open = fd.get("registration_open") === "on";
        body.show_public_list = fd.get("show_public_list") === "on";
        body.capacity = Number(body.capacity);
        body.entry_fee = Number(body.entry_fee);
        try {
          let id = ev.id;
          if (id) await api("/api/admin/events/" + id, { method: "PUT", body });
          else {
            const created = await api("/api/admin/events", { method: "POST", body });
            id = created.id;
          }
          const file = document.getElementById("posterFile")?.files?.[0];
          if (id && (file || (body.poster_url && !String(body.poster_url).startsWith("data:")))) {
            const fdPoster = new FormData();
            if (file) fdPoster.append("file", file);
            if (body.poster_url) fdPoster.append("poster_url", body.poster_url);
            const token = localStorage.getItem("beyx_admin");
            const res = await fetch("/api/admin/events/" + id + "/poster", {
              method: "POST",
              headers: { authorization: "Bearer " + token },
              body: fdPoster,
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || data.ok === false) throw new Error(data.error || "海報上傳失敗");
          }
          editor.classList.add("hidden");
          await boot();
        } catch (err) {
          alert(err.message || "儲存失敗");
        }
      };
      const del = document.getElementById("delEv");
      if (del) del.onclick = async () => {
        if (!confirm("刪除比賽同全部報名？")) return;
        await api("/api/admin/events/" + ev.id, { method: "DELETE" });
        editor.classList.add("hidden");
        await boot();
      };
      const delPoster = document.getElementById("delPoster");
      if (delPoster) delPoster.onclick = async () => {
        if (!ev.id) return;
        if (!confirm("移除呢張海報？")) return;
        try {
          await api("/api/admin/events/" + ev.id + "/poster", { method: "DELETE" });
          ev.poster_url = "";
          renderEditor(ev);
        } catch (err) {
          alert(err.message || "移除失敗");
        }
      };
    }

    function formatHKT(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return (iso || "").replace("T", " ").slice(0, 16);
      const hkt = new Date(d.getTime() + 8 * 60 * 60 * 1000);
      const y = hkt.getUTCFullYear();
      const m = String(hkt.getUTCMonth() + 1).padStart(2, "0");
      const day = String(hkt.getUTCDate()).padStart(2, "0");
      const hh = String(hkt.getUTCHours()).padStart(2, "0");
      const mm = String(hkt.getUTCMinutes()).padStart(2, "0");
      return `${y}-${m}-${day} ${hh}:${mm}`;
    }

    async function loadRegs() {
      const qs = new URLSearchParams();
      if (!eventFilter.value) {
        document.getElementById("regTitle").textContent = "報名名單";
        document.getElementById("regs").innerHTML = "<p class='lede'>請先喺上面揀一場比賽。</p>";
        return;
      }
      qs.set("event_id", eventFilter.value);
      localStorage.setItem("beyx_admin_event", eventFilter.value);
      const ev = events.find((e) => String(e.id) === eventFilter.value);
      document.getElementById("regTitle").textContent = ev
        ? `報名名單 — ${ev.title}`
        : "報名名單";
      if (statusFilter.value) qs.set("status", statusFilter.value);
      const { registrations } = await api("/api/admin/registrations?" + qs.toString());
      const box = document.getElementById("regs");
      if (!registrations.length) {
        box.innerHTML = "<p class='lede'>未有報名。</p>";
        return;
      }
      box.innerHTML = `<table>
        <thead><tr><th>時間</th><th>玩家</th><th>聯絡</th><th>組別</th><th>狀態</th><th>動作</th></tr></thead>
        <tbody>
          ${registrations.map(r => `
            <tr>
              <td>${formatHKT(r.created_at)}</td>
              <td><strong>${r.display_name}</strong><br>${r.real_name || ""}<br><span class="lede">${r.notes || ""}</span></td>
              <td>${r.whatsapp}</td>
              <td>${r.category || ""}</td>
              <td>${statusPill(r.status)}<br><span class="lede">${r.paid_ref || ""}</span></td>
              <td>
                <div class="toolbar">
                  <button class="btn small ok" data-act="confirmed" data-id="${r.id}">確認</button>
                  <button class="btn small" data-act="paid" data-id="${r.id}">已收款</button>
                  <button class="btn small warn" data-act="waitlist" data-id="${r.id}">候補</button>
                  <button class="btn small bad" data-act="rejected" data-id="${r.id}">拒絕</button>
                  <button class="btn small ghost" data-copy="${encodeURIComponent(r.wa_message || "")}">複製 WhatsApp</button>
                  <button class="btn small ghost" data-add-draw="${r.id}">加入抽選</button>
                </div>
              </td>
            </tr>`).join("")}
        </tbody></table>`;

      box.querySelectorAll("[data-act]").forEach(btn => {
        btn.onclick = async () => {
          let paid_ref = "";
          if (btn.dataset.act === "paid") paid_ref = prompt("付款備註（可選，例如轉帳後4位）", "") || "";
          const data = await api("/api/admin/registrations/" + btn.dataset.id, {
            method: "PATCH",
            body: { status: btn.dataset.act, paid_ref },
          });
          if (btn.dataset.act === "confirmed" && data.wa_message) {
            await navigator.clipboard.writeText(data.wa_message).catch(() => {});
            alert("已確認，WhatsApp 訊息已複製（如瀏覽器允許）。");
          }
          await loadRegs();
        };
      });
      box.querySelectorAll("[data-copy]").forEach(btn => {
        btn.onclick = async () => {
          await navigator.clipboard.writeText(decodeURIComponent(btn.dataset.copy));
          btn.textContent = "已複製";
        };
      });
      box.querySelectorAll("[data-add-draw]").forEach(btn => {
        btn.onclick = () => {
          const eventId = eventFilter.value;
          if (!eventId) return;
          const key = manualKey(eventId);
          const arr = JSON.parse(localStorage.getItem(key) || "[]");
          const id = Number(btn.dataset.addDraw);
          if (!arr.includes(id)) arr.push(id);
          localStorage.setItem(key, JSON.stringify(arr));
          btn.textContent = "已加入";
          btn.disabled = true;
        };
      });
    }

    const ALL_STATUSES = [
      { v: "pending", l: "pending（待確認）" },
      { v: "confirmed", l: "confirmed（已確認）" },
      { v: "paid", l: "paid（已付款）" },
      { v: "waitlist", l: "waitlist（候補）" },
      { v: "rejected", l: "rejected（未獲接納）" },
      { v: "cancelled", l: "cancelled（已取消）" },
    ];

    function manualKey(eventId) {
      return "draw_manual_" + eventId;
    }

    async function loadDrawUI() {
      const box = document.getElementById("drawControls");
      if (!eventFilter.value) {
        box.innerHTML = "<p class='lede'>請先揀一場比賽</p>";
        return;
      }
      const eventId = eventFilter.value;

      box.innerHTML = `
        <div class="toolbar" style="flex-wrap:wrap; gap:0.6rem; align-items:center;">
          <label>抽幾個
            <input type="number" id="drawCount" value="8" min="1" style="width:70px">
          </label>
          <button class="btn small ghost" id="selectAllStatus" type="button">全選</button>
          <button class="btn small ghost" id="clearStatus" type="button">清除</button>
          <button class="btn" id="startDraw" type="button">開始抽選</button>
        </div>
        <div style="margin-top:0.6rem; display:flex; flex-wrap:wrap; gap:0.8rem;">
          ${ALL_STATUSES.map(s => `
            <label style="display:inline-flex; align-items:center; gap:0.3rem;">
              <input type="checkbox" class="status-chk" value="${s.v}" ${s.v === "paid" ? "checked" : ""}>
              ${s.l}
            </label>
          `).join("")}
        </div>
        
      `;

      document.getElementById("selectAllStatus").onclick = () => {
        document.querySelectorAll(".status-chk").forEach(el => el.checked = true);
      };
      document.getElementById("clearStatus").onclick = () => {
        document.querySelectorAll(".status-chk").forEach(el => el.checked = false);
      };

      document.getElementById("startDraw").onclick = async () => {
        const count = Number(document.getElementById("drawCount").value) || 1;
        const checked = [...document.querySelectorAll(".status-chk:checked")].map(el => el.value);
        if (!checked.length) return alert("至少揀一個 status");

        const manual = JSON.parse(localStorage.getItem(manualKey(eventId)) || "[]");
        const anim = document.getElementById("drawAnim");
        anim.textContent = "準備中...";

        try {
          const data = await api("/api/admin/draws", {
            method: "POST",
            body: {
              event_id: Number(eventId),
              count,
              statuses: checked,
              manual_include: manual,
            },
          });

          const names = data.candidates.map(c => c.name);
          if (!names.length) {
            anim.textContent = "冇候選";
            return;
          }

          let i = 0;
          const timer = setInterval(() => {
            anim.textContent = names[i % names.length];
            i++;
          }, 70);

          setTimeout(async () => {
            clearInterval(timer);
            const winnerNames = data.selected.map(s => s.name).join("、");
            anim.innerHTML = `<span style="color:#16a34a">抽中：${winnerNames}</span>`;

            const { registrations } = await api("/api/admin/registrations?event_id=" + eventId);
            const regMap = {};
            (registrations || []).forEach(r => { regMap[r.id] = r; });

            document.getElementById("drawResult").innerHTML = `
              <p><strong>結果（${data.selected.length} 人）：</strong></p>
              <ul style="margin:0.3rem 0 0 1.2rem; line-height:1.6;">
                ${data.selected.map(s => {
                  const r = regMap[s.id];
                  const phone = r?.whatsapp || "";
                  return `<li><strong>${s.name}</strong>　${phone}</li>`;
                }).join("")}
              </ul>
            `;
            localStorage.removeItem(manualKey(eventId));
            loadDrawHistory();
            loadRegs();
          }, 2200);
        } catch (err) {
          anim.textContent = "";
          alert(err.message || "抽選失敗");
        }
      };

      loadDrawHistory();
    }

    async function loadDrawHistory() {
      const box = document.getElementById("drawHistory");
      if (!eventFilter.value) {
        box.innerHTML = "";
        return;
      }
      try {
        const { draws } = await api("/api/admin/draws?event_id=" + eventFilter.value);
        if (!draws?.length) {
          box.innerHTML = "<p class='lede'>未有抽選記錄</p>";
          return;
        }

        const latest = draws[0];
        const resultIds = JSON.parse(latest.result_ids || "[]");
        const statuses = JSON.parse(latest.statuses || "[]").join(", ");

        const { registrations } = await api("/api/admin/registrations?event_id=" + eventFilter.value);
        const regMap = {};
        (registrations || []).forEach(r => { regMap[r.id] = r; });

        const listHtml = resultIds.map(id => {
          const r = regMap[id];
          if (!r) return `<li>未知</li>`;
          return `<li><strong>${r.display_name}</strong>　${r.whatsapp}</li>`;
        }).join("");

        box.innerHTML = `
          <h4 style="margin:0 0 0.5rem">最近一次抽選</h4>
          <p class="lede" style="margin:0 0 0.4rem">
            ${(latest.created_at || "").slice(0, 16)} · 抽 ${latest.count_needed} 個 · status: ${statuses}
          </p>
          <ul style="margin:0; padding-left:1.2rem; line-height:1.6;">
            ${listHtml}
          </ul>
          <div style="margin-top:0.8rem">
            <p class="lede">剔選資格不符嘅人，然後補位：</p>
            <div id="disqualifyList" style="margin:0.4rem 0"></div>
            <button class="btn small" id="doReplace" type="button">移除並補位</button>
          </div>
        `;

       listBox.innerHTML = resultIds.map(id => {
  const r = regMap[id];
  const name = r ? `${r.display_name}　${r.whatsapp}` : `ID ${id}`;
  return `<label style="display:flex; align-items:center; gap:0.6rem; margin:0.35rem 0; cursor:pointer;">
    <input type="checkbox" class="dq-chk" value="${id}" style="width:18px; height:18px; flex-shrink:0;">
    <span>${name}</span>
  </label>`;
}).join("");

        document.getElementById("doReplace").onclick = async () => {
          const removeIds = [...document.querySelectorAll(".dq-chk:checked")].map(el => Number(el.value));
          if (!removeIds.length) return alert("請先剔選要移除嘅人");
          if (!confirm(`確定移除 ${removeIds.length} 人並補位？`)) return;

          try {
            const data = await api(`/api/admin/draws/${latest.id}/replace`, {
              method: "POST",
              body: { remove_ids: removeIds },
            });
            alert(`已移除 ${data.removed} 人，補入 ${data.added.length} 人`);
            loadDrawHistory();
          } catch (err) {
            alert(err.message || "補位失敗");
          }
        };
      } catch (err) {
        box.innerHTML = "<p class='lede'>載入抽選記錄失敗</p>";
      }
    }

    async function generateBracket() {
      if (!eventFilter.value) return alert("請先揀比賽");
      if (!confirm("用最近一次抽選結果生成淘汰賽？")) return;

      try {
        const data = await api("/api/admin/brackets", {
          method: "POST",
          body: { event_id: Number(eventFilter.value) },
        });

        const box = document.getElementById("bracketArea");
        const rounds = data.rounds;

        let html = `
          <h3 style="margin-bottom:1rem">淘汰賽名單（${data.players.length} 人，${data.byes} 個 bye）</h3>
          <div style="display:flex; gap:0; overflow-x:auto; padding-bottom:1rem; align-items:flex-start;">
        `;

        rounds.forEach((round, ri) => {
          const roundName = ri === 0 ? "第一輪" :
                            ri === rounds.length - 1 ? "決賽" :
                            `第 ${ri + 1} 輪`;

          html += `
            <div style="min-width:240px; flex-shrink:0; position:relative; padding-right:40px;">
              <div style="font-weight:700; margin-bottom:1rem; text-align:center; color:#f97316;">${roundName}</div>
              <div style="display:flex; flex-direction:column; gap:12px; position:relative;">
          `;

          round.forEach((m, mi) => {
            const p1 = m.p1 ? `${m.p1.name}<br><span style="font-size:0.75rem; opacity:0.65">${m.p1.phone || ""}</span>` : "<span style='opacity:0.45'>BYE</span>";
            const p2 = m.p2 ? `${m.p2.name}<br><span style="font-size:0.75rem; opacity:0.65">${m.p2.phone || ""}</span>` : "<span style='opacity:0.45'>BYE</span>";

            html += `
              <div style="background:#1e2937; border:1px solid #475569; border-radius:8px; padding:0.55rem 0.7rem; font-size:0.88rem; position:relative;">
                <div style="padding:0.2rem 0; border-bottom:1px solid #334155;">${p1}</div>
                <div style="padding:0.2rem 0;">${p2}</div>
                ${ri < rounds.length - 1 ? `
                  <div style="position:absolute; right:-40px; top:50%; width:40px; height:2px; background:#64748b; transform:translateY(-50%);"></div>
                  ${mi % 2 === 0 ? `
                    <div style="position:absolute; right:-40px; top:50%; width:2px; height:calc(100% + 12px); background:#64748b;"></div>
                  ` : ""}
                ` : ""}
              </div>
            `;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += `</div>`;
        box.innerHTML = html;
      } catch (err) {
        alert(err.message || "生成失敗");
      }
    }

    document.getElementById("genBracket").onclick = generateBracket;

    async function boot() {
      const data = await api("/api/admin/events");
      events = data.events || [];
      const saved = localStorage.getItem("beyx_admin_event");
      const keep = eventFilter.value || saved || (events[0] ? String(events[0].id) : "");
      eventFilter.innerHTML = events.length
        ? events.map(ev =>
            `<option value="${ev.id}">${ev.event_kind === "funplay" ? "[Fun Play] " : "[比賽] "}${ev.title}（確認 ${ev.counts?.taken || 0}/${ev.capacity}）</option>`
          ).join("")
        : `<option value="">未有比賽</option>`;
      if (keep && events.some((e) => String(e.id) === String(keep))) eventFilter.value = keep;
      await loadRegs();
      await loadDrawUI();
    }

    document.getElementById("newEvent").onclick = () => renderEditor({});
    document.getElementById("editEvent").onclick = () => {
      const ev = events.find((e) => String(e.id) === eventFilter.value);
      if (ev) renderEditor(ev);
      else alert("請先揀一場比賽");
    };
    document.getElementById("reload").onclick = boot;
    eventFilter.onchange = () => { loadRegs(); loadDrawUI(); };
    statusFilter.onchange = loadRegs;

    if (authed()) {
      showApp(true);
      boot().catch((e) => {
        if (String(e.message).includes("未授權")) {
          localStorage.removeItem("beyx_admin");
          showApp(false);
        } else alert(e.message);
      });
    }
  </script>
</body>
</html>
